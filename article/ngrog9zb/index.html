    <div id="prerender" class="prerender"><article class="md" data-slug="ngrog9zb"><p>最近在打开electron应用时感觉十分卡顿，github desktop给我干到5帧了，什么都点不了，edge开发者工具也是，卡成ppt，打开任务管理器才发现有一个叫mspc的进程一直在吃cpu，把它终止掉之后立刻变流畅了</p>
<p>网上一搜这东西是（微软）电脑管家，于是赶紧去设置里把它卸载了</p>
<p>我记得最开始我的电脑上是没有这个东西的（或者有，但是没闹什么幺蛾子），阿三程序员果然名不虚传😅</p>
<p>不过卸载掉这个电脑管家并没有解决qqnt的卡顿，上网搜了一下是不能启用独显，在启动参数上加个--disable-gpu就好了......</p>
