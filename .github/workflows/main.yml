# Build the blog and publish it to the gh-pages branch.
#
# The framework is fetched from the private ProseOS repository at build time
# and never committed, so this repository can stay public while the framework
# does not. That needs a PROSEOS_TOKEN secret with read access to it.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Fired by the ProseOS repository when the framework changes, so the site is
  # rebuilt against it without a commit here.
  repository_dispatch:
    types: [proseos-updated]

# The publish step pushes to gh-pages with GITHUB_TOKEN, which is read-only
# unless the repository says otherwise or a workflow asks.
permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Fetch ProseOS
        run: node scripts/fetch-framework.mjs
        env:
          PROSEOS_TOKEN: ${{ secrets.PROSEOS_TOKEN }}

      - run: npm install

      - run: npm run build

      # Pages builds this branch with Jekyll, which would skip any path
      # beginning with an underscore. Nothing here does today; this keeps
      # that from becoming a thing to remember.
      - run: touch dist/.nojekyll

      # The framework is in the working tree at this point. Only dist/ is
      # published, and it carries no source maps.
      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
